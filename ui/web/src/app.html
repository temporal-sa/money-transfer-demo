<!DOCTYPE html>
<style>
	body { background: #eef0f8; }
	fieldset, div.border-gray-200.rounded-md { background: #fff; box-shadow: 0 1px 3px rgba(40,40,100,.12); border-color: #dfe2ee; }
	table.leading-normal { background: #fff; border-collapse: separate; border-spacing: 0; border-radius: 8px; box-shadow: 0 1px 3px rgba(40,40,100,.12); }
	table.leading-normal thead th:first-child { border-top-left-radius: 8px; }
	table.leading-normal thead th:last-child { border-top-right-radius: 8px; }
	.progress-bar {
	  background: #e4e4e7;
	  width: 100%;
	  height: 12px;
	  border-radius: 9999px;
	  overflow: hidden;
	}
	.progress {
	  background: #4f46e5;
	  height: 100%;
	  transition: width 0.3s;
	}
  </style>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		%sveltekit.head%
	
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
